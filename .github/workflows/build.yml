name: Build TV launcher
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Outfit font
        run: |
          mkdir -p launcher/assets/fonts
          curl -fL -o launcher/assets/fonts/Outfit.ttf "https://github.com/google/fonts/raw/main/ofl/outfit/Outfit%5Bwght%5D.ttf" || curl -fL -o launcher/assets/fonts/Outfit.ttf "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/outfit/Outfit%5Bwght%5D.ttf"
          ls -la launcher/assets/fonts
      - name: Install SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34"
      - name: Build APK
        run: bash launcher/build-and-install.sh --build
      - uses: actions/upload-artifact@v4
        with:
          name: tvhome
          path: launcher/build/tvhome.apk
